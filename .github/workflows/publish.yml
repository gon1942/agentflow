name: Publish approved npm prerelease
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag (next only until full native E2E is verified)
        type: choice
        options: [next]
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test && npm run test:python
      - name: Verify tag equals package version
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm publish --access public --tag "${{ inputs.dist_tag }}" --provenance
